name: Web tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
