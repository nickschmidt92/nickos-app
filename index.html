                    id: generateId('DOC'),
                    title,
                    type: document.getElementById('docType').value,
                    folder: document.getElementById('docFolder').value,
                    projectId: document.getElementById('docProject').value,
                    url: document.getElementById('docUrl').value,
                    notes: document.getElementById('docNotes').value,
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                });
            }

            saveToLocalStorage();
            closeDocModal();
            render();
        }

        function openBlockerModal(blockerId = null, linkedProjectId = null) {
            appState.editingBlockerId = blockerId;
            const blocker = blockerId ? appState.blockers.find(b => b.id === blockerId) : null;

            document.getElementById('blockerModalTitle').textContent = blocker ? 'Edit Blocker' : 'New Blocker';
            document.getElementById('blockerTitle').value = blocker?.title || '';
            document.getElementById('blockerFolder').value = blocker?.folder || 'LIFE';
            document.getElementById('blockerSeverity').value = blocker?.severity || 'HIGH';
            document.getElementById('blockerStatus').value = blocker?.status || 'OPEN';
            document.getElementById('blockerProject').value = blocker?.projectId || linkedProjectId || '';
            document.getElementById('blockerDescription').value = blocker?.description || '';
            document.getElementById('blockerResolution').value = blocker?.resolution || '';

            document.getElementById('blockerModal').classList.add('active');
        }

        function closeBlockerModal() {
            document.getElementById('blockerModal').classList.remove('active');
        }

        function saveBlocker() {
            const title = document.getElementById('blockerTitle').value.trim();
            if (!title) {
                alert('Title is required');
                return;
            }

            if (appState.editingBlockerId) {
                const blocker = appState.blockers.find(b => b.id === appState.editingBlockerId);
                blocker.title = title;
                blocker.folder = document.getElementById('blockerFolder').value;
                blocker.severity = document.getElementById('blockerSeverity').value;
                blocker.status = document.getElementById('blockerStatus').value;
                blocker.projectId = document.getElementById('blockerProject').value;
                blocker.description = document.getElementById('blockerDescription').value;
                blocker.resolution = document.getElementById('blockerResolution').value;
                blocker.updated = new Date().toISOString();
                if (blocker.status === 'RESOLVED' && !blocker.resolvedDate) {
                    blocker.resolvedDate = new Date().toISOString();
                }
            } else {
                appState.blockers.push({
                    id: generateId('B'),
                    title,
                    folder: document.getElementById('blockerFolder').value,
                    projectId: document.getElementById('blockerProject').value,
                    severity: document.getElementById('blockerSeverity').value,
                    status: document.getElementById('blockerStatus').value,
                    description: document.getElementById('blockerDescription').value,
                    resolution: document.getElementById('blockerResolution').value,
                    resolvedDate: '',
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                });
            }

            saveToLocalStorage();
            closeBlockerModal();
            render();
        }

        function closeAllModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        /* ═══════ SEARCH ═══════ */
        function openSearch() {
            document.getElementById('searchOverlay').classList.add('active');
            document.getElementById('searchInput').focus();
        }

        function closeSearch() {
            document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchResults').innerHTML = '';
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            let results = [];

            appState.tasks.forEach(t => {
                if (t.title.toLowerCase().includes(query) || (t.originalText && t.originalText.toLowerCase().includes(query))) {
                    results.push({ type: 'task', item: t });
                }
            });

            appState.projects.forEach(p => {
                if (p.title.toLowerCase().includes(query)) {
                    results.push({ type: 'project', item: p });
                }
            });

            appState.decisions.forEach(d => {
                if (d.title.toLowerCase().includes(query)) {
                    results.push({ type: 'decision', item: d });
                }
            });

            appState.docs.forEach(d => {
                if (d.title.toLowerCase().includes(query)) {
                    results.push({ type: 'doc', item: d });
                }
            });

            const html = results.slice(0, 20).map(r => `
                <div class="search-result-item" style="cursor:pointer;" onclick="selectSearchResult('${r.type}', '${escapeHtml(r.item.id)}')">
                    <div class="search-result-title">${escapeHtml(r.item.title)}</div>
                    <div class="search-result-meta">${r.type.toUpperCase()} • ${escapeHtml(r.item.folder)}</div>
                </div>
            `).join('');

            document.getElementById('searchResults').innerHTML = html || '<div class="search-result-item" style="text-align: center; color: #9ca3af;">No results</div>';
        }

        function selectSearchResult(type, id) {
            closeSearch();
            if (type === 'task') openTaskModal(id);
            else if (type === 'project') openProjectModal(id);
            else if (type === 'decision') openDecisionModal(id);
            else if (type === 'doc') openDocModal(id);
        }

        /* ═══════ UTILITIES ═══════ */
        function generateId(prefix) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id = '';
            for (let i = 0; i < 5; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return `${prefix}-${id}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function calculateDuration(startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const days = Math.floor((end - start) / (1000 * 60 * 60 * 24));
            return `${days} day${days !== 1 ? 's' : ''}`;
        }

        function populateFolderSelects() {
            const selects = ['taskFolder', 'projectFolder', 'decisionFolder', 'docFolder', 'blockerFolder'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (select) {
                    FOLDERS.forEach(folder => {
                        const option = document.createElement('option');
                        option.value = folder;
                        option.textContent = folder;
                        select.appendChild(option);
                    });
                }
            });
        }

        function populateProjectSelects() {
            const selects = ['taskProject', 'decisionProject', 'docProject', 'blockerProject'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (select) {
                    appState.projects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.id;
                        option.textContent = project.title;
                        select.appendChild(option);
                    });
                }
            });
        }

        /* ═══════ PERSISTENCE (HARDENED) ═══════ */
        // Snapshot inline counts at boot BEFORE any merge — used as floor values.
        const INLINE_COUNTS = {
            tasks: appState.tasks.length,
            projects: appState.projects.length,
            decisions: appState.decisions.length,
            docs: appState.docs.length,
            blockers: appState.blockers.length,
            reviews: appState.reviews.length
        };

        function saveToLocalStorage() {
            try {
                const payload = {
                    _version: '4.0',
                    _saved: new Date().toISOString(),
                    _counts: {
                        tasks: appState.tasks.length,
                        projects: appState.projects.length,
                        decisions: appState.decisions.length,
                        docs: appState.docs.length,
                        blockers: appState.blockers.length,
                        reviews: appState.reviews.length
                    },
                    currentPage: appState.currentPage,
                    taskFilters: appState.taskFilters,
                    taskView: appState.taskView,
                    tasks: appState.tasks,
                    projects: appState.projects,
                    decisions: appState.decisions,
                    docs: appState.docs,
                    blockers: appState.blockers,
                    reviews: appState.reviews
                };
                localStorage.setItem('nickos_v4', JSON.stringify(payload));
            } catch (e) {
                console.error('localStorage save failed:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('nickos_v4');
                if (!saved) return;
                const data = JSON.parse(saved);

                // Restore UI preferences
                if (data.currentPage) appState.currentPage = data.currentPage;
                if (data.taskFilters) appState.taskFilters = data.taskFilters;
                if (data.taskView) appState.taskView = data.taskView;

                // MERGE RULE: Inline HTML data is ALWAYS the boot source of truth.
                // localStorage items with NEW IDs are added (runtime-created items survive).
                // Inline items are NEVER overwritten by localStorage.
                const entityKeys = ['tasks', 'projects', 'decisions', 'docs', 'blockers', 'reviews'];
                entityKeys.forEach(key => {
                    if (!data[key] || !Array.isArray(data[key])) return;
                    const inlineIds = new Set((appState[key] || []).map(item => item.id));
                    const newItems = data[key].filter(item => item.id && !inlineIds.has(item.id));
                    if (newItems.length > 0) {
                        appState[key] = [...appState[key], ...newItems];
                        // console.log('[NickOS] Merged ' + newItems.length + ' new ' + key + ' from localStorage');
                    }
                });

                // console.log('[NickOS] localStorage loaded. Tasks:' + appState.tasks.length + ' Proj:' + appState.projects.length + ' Dec:' + appState.decisions.length);
            } catch (e) {
                console.error('[NickOS] localStorage load failed:', e);
            }
        }

        function resetLocalStorage() {
            if (!confirm('Clear all localStorage and reset to inline HTML data?')) return;
            localStorage.removeItem('nickos_v4');
            alert('localStorage cleared. Refresh the page to load from inline HTML.');
        }

        /* ═══════ THEME ═══════ */
        function loadTheme() {
            const savedTheme = localStorage.getItem('nickos_theme') || 'dark';
            appState.theme = savedTheme;
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        function toggleTheme() {
            if (appState.theme === 'dark') {
                appState.theme = 'light';
                document.body.classList.add('light-mode');
            } else {
                appState.theme = 'dark';
                document.body.classList.remove('light-mode');
            }
            localStorage.setItem('nickos_theme', appState.theme);
        }

        /* ═══════ EXPORT / IMPORT ═══════ */
        function exportData() {
            const data = {
                _version: '4.0',
                _exported: new Date().toISOString(),
                _counts: {
                    tasks: appState.tasks.length,
                    projects: appState.projects.length,
                    decisions: appState.decisions.length,
                    docs: appState.docs.length,
                    blockers: appState.blockers.length,
                    reviews: appState.reviews.length
                },
                tasks: appState.tasks,
                projects: appState.projects,
                decisions: appState.decisions,
                docs: appState.docs,
                blockers: appState.blockers,
                reviews: appState.reviews
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'nickos-export-' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    const entityKeys = ['tasks', 'projects', 'decisions', 'docs', 'blockers', 'reviews'];
                    const found = entityKeys.filter(k => data[k] && Array.isArray(data[k]));
                    if (found.length === 0) { alert('Invalid import file.'); return; }
                    const summary = found.map(k => k + ': ' + data[k].length).join(', ');
                    if (!confirm('IMPORT PREVIEW\n\nIncoming: ' + summary + '\n\nThis will REPLACE matching data. A backup will be exported first.\n\nProceed?')) return;
                    exportData();
                    found.forEach(key => { appState[key] = data[key]; });
                    saveToLocalStorage();
                    render();
                    alert('Import complete! Loaded: ' + summary);
                } catch (err) { alert('Import error: ' + err.message); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        document.getElementById('importFile').addEventListener('change', importData);

        /* ═══════ BATCH OPERATIONS ═══════ */
        function batchChangeStatus(newStatus) {
            if (appState.selectedTasks.length === 0) return;
            appState.selectedTasks.forEach(taskId => {
                const task = appState.tasks.find(t => t.id === taskId);
                if (task) {
                    task.status = newStatus;
                    task.lastTouchedDate = new Date().toISOString();
                    if (newStatus === 'DONE') {
                        task.completedDate = new Date().toISOString();
                    } else if (task.completedDate) {
                        task.completedDate = '';
                    }
                }
            });
            appState.selectedTasks = [];
            saveToLocalStorage();
            render();
        }

        function batchChangePriority(newPriority) {
            if (appState.selectedTasks.length === 0) return;
            appState.selectedTasks.forEach(taskId => {
                const task = appState.tasks.find(t => t.id === taskId);
                if (task) { task.priority = newPriority; task.lastTouchedDate = new Date().toISOString(); }
            });
            appState.selectedTasks = [];
            saveToLocalStorage();
            render();
        }

        function batchDelete() {
            if (appState.selectedTasks.length === 0) return;
            if (!confirm('Delete ' + appState.selectedTasks.length + ' tasks?')) return;
            appState.tasks = appState.tasks.filter(t => !appState.selectedTasks.includes(t.id));
            appState.selectedTasks = [];
            saveToLocalStorage();
            render();
        }

        /* ═══════ AI PHONE SYSTEM TRACKER ═══════ */

            if (!appState.aiPhoneChecklist) appState.aiPhoneChecklist = {};
            appState.aiPhoneChecklist[id] = !appState.aiPhoneChecklist[id];
            saveToLocalStorage();
            render();
        }

        /* ═══════ COWORK API ═══════ */
        window.nickosInject = function(data, mode) {
            mode = mode || 'merge';
            const entityKeys = ['tasks', 'projects', 'decisions', 'docs', 'blockers', 'reviews'];
            entityKeys.forEach(key => {
                if (!data[key] || !Array.isArray(data[key])) return;
                if (mode === 'replace') { appState[key] = data[key]; }
                else {
                    const existingIds = new Set(appState[key].map(item => item.id));
                    const newItems = data[key].filter(item => item.id && !existingIds.has(item.id));
                    appState[key] = [...appState[key], ...newItems];
                }
            });
            saveToLocalStorage();
            render();
        };

        // Expose the handful of app internals that the cloud-sync module reads/writes.
        // (cloud-sync.js is an ES module loaded after this block.)
        window.appState = appState;
        window.saveToLocalStorage = saveToLocalStorage;
        window.render = render;
    </script>
    <script type="module" src="cloud-sync.js"></script>
    <script>
        // PWA service worker registration — only runs over http(s), silently skipped on file://
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
